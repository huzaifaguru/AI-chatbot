<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova – AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Markdown rendering + sanitising (so model output can't inject HTML) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>🤖 Nova</h1>
        <span class="subtitle">AI study &amp; coding assistant</span>
      </div>
      <div class="header-actions">
        <label class="toggle" title="Read replies aloud">
          <input type="checkbox" id="speak-toggle"> 🔊 Voice
        </label>
        <button id="new-chat" class="secondary" title="Clear the conversation">New chat</button>
      </div>
    </header>

    <main id="messages">
      <div class="empty-state" id="empty-state">
        <p class="hello">Hi, I'm Nova 👋</p>
        <p>I can explain programming concepts, help debug code, or answer general questions.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain what an API is with a simple example">What is an API?</button>
          <button class="suggestion" data-prompt="What's the difference between a list and a tuple in Python?">List vs tuple in Python</button>
          <button class="suggestion" data-prompt="How should I start learning AI as a beginner?">Getting started with AI</button>
        </div>
      </div>
    </main>

    <form id="chat-form">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Message Nova… (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
      <button type="button" id="mic" class="secondary" title="Speak your message">🎤</button>
      <button type="submit" id="send">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
