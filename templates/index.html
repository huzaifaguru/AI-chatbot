<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Markdown rendering + sanitising (so model output can't inject HTML) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>🤖 AI Chatbot</h1>
      <div class="header-actions">
        <label class="toggle" title="Read replies aloud">
          <input type="checkbox" id="speak-toggle"> 🔊 Voice replies
        </label>
        <button id="new-chat" class="secondary">New chat</button>
      </div>
    </header>

    <main id="messages">
      <div class="empty-state" id="empty-state">
        <p>Ask me anything to get started.</p>
      </div>
    </main>

    <form id="chat-form">
      <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
      <button type="button" id="mic" class="secondary" title="Speak your message">🎤</button>
      <button type="submit" id="send">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
